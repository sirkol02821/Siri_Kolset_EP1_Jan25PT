<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AyToZee - Checkout</title>
  <meta name="description" content="Browse varied products at AyToZee.">
  <link rel="icon" type="image/svg+xml" href="../assets/logo/aytozee-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/pages/checkout.css">
</head>
<body>
    <header id="header">
            <!-- header content created in header.js -->

        <nav class="navbar hidden">
            <ul id="tag-nav"></ul><!-- Generated with JS from API tags-->   
        </nav>
    </header>
    
    <main>
        <h1>Checkout</h1>
        <div class="checkout-page">
            
            <section class="order-summary">
                <h2>Order Summary</h2>
                <div id="checkout-items"></div>
                <p id="checkout-total">Total: 0 NOK</p>
            </section>

            <section class="form-container">
                <h2>Shipping Details & Payment</h2>
                <form id="checkout-form" class="checkout-form">
                    <div class="form-field">
                        <label for="first-name">First name</label>
                        <input type="text" id="first-name" name="firstName" required>
                    </div>
                    <div class="form-field">
                        <label for="last-name">Last name</label>
                        <input type="text" id="last-name" name="lastName" required>
                    </div>
                    <div class="form-field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-field">
                        <label for="phone">Phone</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>
                    <div class="form-field">
                        <label for="address">Address</label>
                        <input type="text" id="address" name="address" required>
                    </div>
                    <div class="form-field">
                        <label for="postal-code">Postal code</label>
                        <input type="text" id="postal-code" name="postalCode" required>
                    </div>
                    <div class="form-field">
                        <label for="city">City</label>
                        <input type="text" id="city" name="city" required>
                    </div>

                    <h2>Payment Options</h2>
                    <div class="payment">         
                        <div class="payment-option">
                            <input type="radio" id="card" name="payment" value="card" checked>
                            <label for="card">Credit / Debit Card</label>
                        </div>
                        <div class="payment-option">
                            <input type="radio" id="vipps" name="payment" value="vipps">
                            <label for="vipps">Vipps</label>
                        </div>
                        <div class="payment-option">
                            <input type="radio" id="paypal" name="payment" value="paypal">
                            <label for="paypal">PayPal</label>
                        </div>
                    </div>
                    
                    <div id="form-error" class="form-error"></div>
                    <button type="submit" class="btn btn-primary">Complete Purchase</button>
                </form>

            </section>
        </div>

    </main>
    <footer id="footer">
            <!-- footer content created in footer.js -->
    </footer>

    <script type="module" src="../js/pages/checkout.js"></script>
    <script type="module" src="../js/main.js"></script>
</body>
