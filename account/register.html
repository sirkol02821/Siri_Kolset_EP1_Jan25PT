<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AyToZee - Register</title>
  <meta name="description" content="Browse varied products at AyToZee.">
  <link rel="icon" type="image/svg+xml" href="../assets/logo/aytozee-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/pages/register.css">
</head>
<body>
    <header id="header">
            <!-- header content created in header.js -->

        <nav class="navbar hidden">
            <ul id="tag-nav"></ul><!-- Generated with JS from API tags-->   
        </nav>
    </header>

    <aside id="cart-overlay" class="cart-overlay hidden">
        <!-- Content of cart overlay is handled in cart.js -->
    </aside>
    
    <main>
        <section class="form-container">
            <form id="register-form" class="register-form">
                <h1>Create an account</h1>
                <div class="form-field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-field">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirmPassword" minlength="8" required>
                </div>
                <div id="register-error" class="form-error"></div>
                <button type="submit" class="btn btn-primary">Create account</button>
                <div class="login-prompt">
                    <p>Already have an account?</p>
                    <a href="./login.html" class="btn btn-secondary">Log in</a>
                </div>
            </form>
        </section>
    </main>
    <footer id="footer">
            <!-- footer content created in footer.js -->
    </footer>

    <script type="module" src="../js/pages/register.js"></script>
    <script type="module" src="../js/main.js"></script>
</body>
