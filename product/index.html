<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AyToZee - Product</title>
  <meta name="description" content="Browse varied products at AyToZee.">
  <link rel="icon" type="image/svg+xml" href="../assets/logo/aytozee-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/pages/product.css">
</head>
<body>
    <header id="header">
            <!-- header content created in header.js -->

        <nav class="navbar hidden">
            <ul id="tag-nav"></ul><!-- Generated with JS from API tags-->   
        </nav>
    </header>

    <aside id="cart-overlay" class="cart-overlay hidden">
        <!-- Content of cart overlay is handled in cart.js -->
    </aside>
    
    <main>
        <section id="product-details" class="product-details">
            <!-- product details imported from js/pages/product-details.js --> 
        </section>
    </main>
    <footer id="footer">
        <!-- footer content created in footer.js -->
    </footer>

    <script type="module" src="../js/pages/product-details.js"></script>
    <script type="module" src="../js/main.js"></script>
</body>
